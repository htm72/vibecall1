<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم الشاملة | Vibe Call</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');

        :root {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --bg-dark: #0f172a;
            --bg-light: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-main); display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background: var(--bg-dark);
            color: #fff;
            padding: 20px 0;
            position: fixed;
            height: 100vh;
            right: 0;
            top: 0;
        }

        .sidebar-brand {
            font-size: 20px;
            font-weight: 800;
            padding: 0 20px 20px;
            border-bottom: 1px solid #334155;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-menu { list-style: none; margin-top: 20px; }
        .sidebar-menu li a {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 20px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 15px;
            transition: 0.3s;
        }

        .sidebar-menu li a:hover, .sidebar-menu li a.active {
            background: rgba(56, 189, 248, 0.1);
            color: #38bdf8;
            border-right: 4px solid #38bdf8;
        }

        /* Main Content */
        .main-content {
            margin-right: 250px;
            flex: 1;
            padding: 30px;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            background: var(--card-bg);
            padding: 15px 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .stat-icon {
            width: 50px;
            height: 50px;
            background: #e0f2fe;
            color: var(--primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .stat-info h4 { font-size: 13px; color: var(--text-muted); }
        .stat-info span { font-size: 22px; font-weight: 800; }

        /* Panels */
        .panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .panel-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Form & Tables */
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
        input { flex: 1; min-width: 200px; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; }

        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-danger { background: #ef4444; padding: 5px 10px; font-size: 12px; }

        table { width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        th { background: #f1f5f9; color: var(--text-muted); }

        @media (max-width: 768px) {
            .sidebar { width: 60px; }
            .sidebar-brand span, .sidebar-menu li a span { display: none; }
            .main-content { margin-right: 60px; padding: 15px; }
        }
    </style>
</head>
<body>

    <!-- القائمة الجانبية -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fa-solid fa-gauge-high"></i>
            <span>Vibe Admin</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="#stats" class="active"><i class="fa-solid fa-chart-pie"></i> <span>الإحصائيات</span></a></li>
            <li><a href="#partners-section"><i class="fa-solid fa-handshake"></i> <span>إدارة الشركاء</span></a></li>
            <li><a href="#messages-section"><i class="fa-solid fa-envelope"></i> <span>الرسائل والطلبات</span></a></li>
        </ul>
    </aside>

    <!-- المحتوى الرئيسي -->
    <main class="main-content">
        
        <div class="header-bar">
            <h3>لوحة التحكم الرئيسية</h3>
            <div><i class="fa-solid fa-user-shield"></i> الأدمن</div>
        </div>

        <!-- كروت الإحصائيات -->
        <div class="stats-grid" id="stats">
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-handshake"></i></div>
                <div class="stat-info">
                    <h4>إجمالي الشركاء</h4>
                    <span id="partnersCount">0</span>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon"><i class="fa-solid fa-envelope"></i></div>
                <div class="stat-info">
                    <h4>الرسائل الواردة</h4>
                    <span id="messagesCount">0</span>
                </div>
            </div>
        </div>

        <!-- قسم إضافة الشركاء -->
        <div class="panel" id="partners-section">
            <div class="panel-title"><i class="fa-solid fa-plus-circle"></i> إضافة شريك جديد</div>
            <form id="addPartnerForm" class="form-row">
                <input type="text" id="partnerName" placeholder="اسم الشريك أو الشركة" required>
                <input type="text" id="partnerCategory" placeholder="القطاع أو المجال" required>
                <button type="submit" class="btn">حفظ الشريك</button>
            </form>

            <div class="panel-title" style="margin-top: 25px;"><i class="fa-solid fa-list"></i> قائمة الشركاء الحالية</div>
            <table>
                <thead>
                    <tr>
                        <th>اسم الشركة</th>
                        <th>المجال</th>
                        <th>الإجراءات</th>
                    </tr>
                </thead>
                <tbody id="partnersTable">
                    <tr><td colspan="3" style="text-align: center;">جاري التحميل...</td></tr>
                </tbody>
            </table>
        </div>

        <!-- قسم الرسائل الواردة -->
        <div class="panel" id="messages-section">
            <div class="panel-title"><i class="fa-solid fa-inbox"></i> الرسائل وطلبات التواصل</div>
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>التواصل</th>
                        <th>الرسالة</th>
                    </tr>
                </thead>
                <tbody id="messagesTable">
                    <tr><td colspan="3" style="text-align: center;">لا توجد رسائل جديدة.</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script>
        // إعدادات الربط بـ Supabase
        const SUPABASE_URL = 'https://epsilonvcrqwo.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_c_EhFsAIg_l3b8hS6LtC2A_yG159JlJ';
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // جلب قائمة الشركاء وتحديث الجدول والإحصائيات
        async function loadPartners() {
            const tbody = document.getElementById('partnersTable');
            const { data, error } = await supabase.from('partners').select('*').order('id', { ascending: false });

            if (error) {
                tbody.innerHTML = `<tr><td colspan="3" style="color:red;">خطأ: ${error.message}</td></tr>`;
                return;
            }

            document.getElementById('partnersCount').innerText = data.length;

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">لا يوجد شركاء حالياً.</td></tr>';
                return;
            }

            tbody.innerHTML = '';
            data.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${p.name}</b></td>
                        <td>${p.category}</td>
                        <td><button class="btn btn-danger" onclick="deletePartner(${p.id})"><i class="fa-solid fa-trash"></i> حذف</button></td>
                    </tr>
                `;
            });
        }

        // إضافة شريك جديد
        document.getElementById('addPartnerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('partnerName').value;
            const category = document.getElementById('partnerCategory').value;

            const { error } = await supabase.from('partners').insert([{ name, category }]);

            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } else {
                document.getElementById('addPartnerForm').reset();
                loadPartners();
            }
        });

        // حذف شريك
        async function deletePartner(id) {
            if (confirm('هل أنت تأكد من الحذف؟')) {
                await supabase.from('partners').delete().eq('id', id);
                loadPartners();
            }
        }

        // تشغيل الوظائف عند فتح الصفحة
        loadPartners();
    </script>
</body>
</html>
